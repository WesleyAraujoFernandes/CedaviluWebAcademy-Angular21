<h1>Listagem de países</h1>
@if (cargando()) {
  <p>Cargando paises...</p>
}
@if(error()) {
  <p class="error">Error: {{ error() }}</p>
}
@if(!cargando() && !error()) {
  <div class="grid">
    @for (pais of paises(); track pais.name.common ) {
      <div class="card">
        <img
          [src]="pais.flags.png"
          [alt]="pais.name.common"
        >
        <h3>{{ pais.name.common }}</h3>
        <p><strong>Capital:</strong> {{pais.capital}}</p>
        <p><strong>População:</strong> {{pais.population}}</p>
      </div>
    }
  </div>
}
